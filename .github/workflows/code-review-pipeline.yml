name: AI Code Review - Veterinaria UTN

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar con Gemini
        uses: google-gemini/github-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-1.5-flash"
          # Aquí configuramos la personalidad del bot
          system_instruction: |
            Actúa como un revisor de código Senior y profesor de la UTN. 
            Estás revisando el "Proyecto Veterinaria".
            Tu objetivo es asegurar que el código sea profesional, seguro y escalable.
            
            Criterios de revisión:
            1. Seguridad: Verificar que los endpoints de Express tengan validaciones y manejo de errores.
            2. Tipado: En el frontend (React + TS), asegurar que las interfaces estén bien definidas.
            3. Lógica de Negocio: Revisar que el flujo de turnos y mascotas sea coherente.
            4. Limpieza: Detectar código muerto, console.logs olvidados o mala indentación.
            
            Responde siempre en español. Sé crítico pero pedagógico.
