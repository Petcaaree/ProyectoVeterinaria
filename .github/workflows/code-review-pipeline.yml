name: Code Review Pipeline - Veterinaria UTN

on:
  pull_request:
    branches: [main, develop]
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  quality-check:
    name: "🔍 Quality & Security"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            cliente/package-lock.json

      - name: Install Dependencies
        run: |
          cd server && npm ci
          cd ../cliente && npm ci

      - name: Linting
        run: |
          cd server && (npm run lint || npx eslint . --max-warnings 0)
          cd ../cliente && npm run lint

      - name: Server Tests
        working-directory: server
        run: |
          npm run unit-test
          npm run integration-test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  build-check:
    name: "🏗️ Build Verification"
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cliente/package-lock.json

      - name: Build Frontend
        run: |
          cd cliente && npm ci && npm run build

  ai-review:
    name: "🤖 Gemini Code Review"
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -l < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: Review with Gemini
        if: steps.diff.outputs.diff_size > 0
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY no está configurado. Saltando review de IA." > ai_review.txt
            echo "verdict=APROBADO" >> $GITHUB_ENV
            exit 0
          fi

          head -3000 pr_diff.txt > pr_diff_trimmed.txt

          python3 <<'PYEOF'
          import json
          diff = open('pr_diff_trimmed.txt').read()
          prompt = (
            "Sos un code reviewer senior de la UTN. Analizá este diff de un proyecto de "
            "Veterinaria (Node.js/Express, React/Vite, MongoDB/Mongoose). Respondé en ESPAÑOL "
            "con este formato:\n\n## Resumen\n## Problemas de Lógica/Seguridad\n"
            "## Sugerencias de Arquitectura\n## Veredicto\nAPROBADO o CAMBIOS_NECESARIOS\n\n"
            "IMPORTANTE: La última línea debe ser VEREDICTO:APROBADO o VEREDICTO:CAMBIOS_NECESARIOS.\n\n"
            "Diff:\n" + diff
          )
          payload = {'contents': [{'parts': [{'text': prompt}]}]}
          with open('request.json', 'w') as f:
              json.dump(payload, f)
          PYEOF

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H 'Content-Type: application/json' \
            -d @request.json)

          echo "$RESPONSE" > response.json

          REVIEW=$(python3 <<'PYEOF'
          import json
          try:
              data = json.load(open('response.json'))
          except Exception as e:
              print(f"⚠️ Respuesta inválida de Gemini: {e}")
              raise SystemExit(0)
          if 'error' in data:
              print("⚠️ Error: " + data['error'].get('message', ''))
          else:
              try:
                  print(data['candidates'][0]['content']['parts'][0]['text'])
              except Exception:
                  print('⚠️ No se pudo obtener respuesta del modelo.')
          PYEOF
          )

          echo "$REVIEW" > ai_review.txt

          VERDICT=$(echo "$REVIEW" | grep -o 'VEREDICTO:[A-Z_]*' | tail -1 | cut -d: -f2)
          echo "verdict=${VERDICT:-APROBADO}" >> $GITHUB_ENV

      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('ai_review.txt')) {
              const review = fs.readFileSync('ai_review.txt', 'utf8');
              const verdict = process.env.verdict || 'APROBADO';
              const icon = verdict === 'APROBADO' ? '✅' : '❌';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Gemini AI Review\n\n${review}\n\n---\n**Status: ${icon} ${verdict}**`
              });
            }

  ready-to-deploy:
    name: "Ready to Deploy"
    needs: [quality-check, build-check, ai-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Overall Results
        run: |
          if [[ "${{ needs.quality-check.result }}" == "success" && \
                "${{ needs.build-check.result }}" == "success" && \
                ( "${{ needs.ai-review.result }}" == "success" || "${{ needs.ai-review.result }}" == "skipped" ) ]]; then
            echo "✅ El proyecto está listo para merge."
          else
            echo "❌ El pipeline detectó fallos. Revisá los jobs anteriores."
            exit 1
          fi